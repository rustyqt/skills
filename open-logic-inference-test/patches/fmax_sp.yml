files:
  include:
    - "../../../src/base/**/*.vhd"
    - "../../../src/ft/**/*.vhd"

exclude_entities:
  - "olo_private_*"
  - "olo_base_*"
  - "olo_ft_private_*"

entities:

  # ECC RAM, no scrubber (single-port) -- isolates the ECC codec cost on the SP topology.
  - entity_name: "olo_ft_ram_sp"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w32-ecc0-lat1"
        generics: { Width_g: 32, EccPipeline_g: 0, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc1-lat1"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc2-lat1"
        generics: { Width_g: 32, EccPipeline_g: 2, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc0-lat2"
        generics: { Width_g: 32, EccPipeline_g: 0, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc1-lat2"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc2-lat2"
        generics: { Width_g: 32, EccPipeline_g: 2, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }

  # ECC RAM + scrubber (single-port, pacer off). ecc0 vs ft_ram_sp ecc0 => scrubber-mux delta;
  # the full grid shows the registered-decoder writeback path holds Fmax parity with plain ECC RAM.
  - entity_name: "olo_ft_ram_sp_scrub"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w32-ecc0-lat1"
        generics: { Width_g: 32, EccPipeline_g: 0, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc1-lat1"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc2-lat1"
        generics: { Width_g: 32, EccPipeline_g: 2, RamRdLatency_g: 1 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc0-lat2"
        generics: { Width_g: 32, EccPipeline_g: 0, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc1-lat2"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
      - name: "w32-ecc2-lat2"
        generics: { Width_g: 32, EccPipeline_g: 2, RamRdLatency_g: 2 }
        in_reduce: { WrData: 32, ErrInj_BitFlip: 39 }
        out_reduce: { RdData: 32 }
